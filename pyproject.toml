[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "S"]
ignore = [
    "S301", # le seul fichier joblib chargé est celui du dépôt, vérifié par empreinte
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
